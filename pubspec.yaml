name: flutter_workspace
description: App de Forex — noticias de alto impacto en tiempo real, filtros y alertas.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.4'

dependencies:
  http: ^1.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
