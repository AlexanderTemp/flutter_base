name: flutter_workspace
description: Base educativa de un espacio de trabajo para móvil y escritorio.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.4'

dependencies:
  appflowy_ui:
    path: packages/appflowy_ui
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
