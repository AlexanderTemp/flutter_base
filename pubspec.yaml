name: flutter_workspace
description: Tradex — mercados, criptomonedas, noticias económicas y alertas.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  appflowy_ui:
    path: packages/appflowy_ui
  http: ^1.2.2
  intl: ^0.19.0
  xml: ^6.5.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^19.5.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/branding/tradex.png
    - pubspec.yaml
